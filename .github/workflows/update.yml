name: KIOXIA WATCH Auto Update

on:
  workflow_dispatch:
  schedule:
    - cron: "30 7 * * 1-5"
      timezone: "Asia/Tokyo"
    - cron: "30 16 * * 1-5"
      timezone: "Asia/Tokyo"

permissions:
  contents: write
  pages: write
  id-token: write

concurrency:
  group: kioxia-watch-auto
  cancel-in-progress: false

jobs:
  update:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v6
        with:
          fetch-depth: 0

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Update market data
        run: python scripts/update_market.py

      - name: Commit data changes
        run: |
          git config user.name "kioxia-watch-bot"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add data/market.json
          if git diff --cached --quiet; then
            echo "No data changes."
          else
            git commit -m "auto: update KIOXIA WATCH market data"
            git push
          fi

      - name: Configure Pages
        uses: actions/configure-pages@v5

      - name: Upload Pages artifact
        uses: actions/upload-pages-artifact@v3
        with:
          path: "."

      - name: Deploy Pages
        id: deployment
        uses: actions/deploy-pages@v4
